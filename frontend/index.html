<!doctype html>
<html class="dark" data-theme="dark" lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="MicroURL — Fast, privacy-friendly short links with instant QR codes." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=4" />
  <link rel="shortcut icon" href="/favicon.ico?v=4" />
  <title>MicroURL</title>
  <script>
    (function () {
      var saved = localStorage.getItem("theme");
      var theme = saved === "light" || saved === "dark" ? saved : "dark";
      var root = document.documentElement;
      root.setAttribute("data-theme", theme);
      if (theme === "dark") {
        root.classList.add("dark");
      } else {
        root.classList.remove("dark");
      }
    })();
  </script>
</head>

<body
  class="bg-background text-on-surface antialiased min-h-screen flex flex-col justify-between selection:bg-primary-container selection:text-on-primary-container">
  <div id="root" class="min-h-screen flex flex-col justify-between"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
