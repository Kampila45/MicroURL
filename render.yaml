# MicroURL — Render Blueprint
#
# Deploy the backend (Go API) and frontend on Render.
#
# First-deploy steps:
#   1. Push this file to your GitHub repo.
#   2. In Render -> New -> Blueprint, point it at the repo.
#   3. Fill in the env vars marked `sync: false` (DATABASE_URL, BASE_URL,
#      TURNSTILE_SECRET_KEY, UPSTASH_REDIS_REST_URL, UPSTASH_REDIS_REST_TOKEN,
#      VITE_API_BASE_URL, VITE_TURNSTILE_SITE_KEY).
#   4. Note on Upstash Redis: if UPSTASH_REDIS_REST_URL or UPSTASH_REDIS_REST_TOKEN
#      is left blank, the API runs in degraded-cache mode and falls back to
#      PostgreSQL cleanly.

services:
  # ---------------------------------------------------------------------------
  # Backend — Go API
  # ---------------------------------------------------------------------------
  - type: web
    name: microurl-backend
    runtime: go
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: go build -o api ./cmd/api
    startCommand: ./api
    healthCheckPath: /health
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: "8080"

      # Public base URL of this backend service (used in short_url, qr_code_url,
      # and OpenAPI server URLs), e.g. https://microurl-backend.onrender.com
      - key: BASE_URL
        sync: false

      # PostgreSQL connection string (e.g. Neon or Supabase Postgres).
      # Set in Render dashboard — never commit credentials here.
      - key: DATABASE_URL
        sync: false

      # Cloudflare Turnstile secret key (required when APP_ENV=production).
      - key: TURNSTILE_SECRET_KEY
        sync: false

      # Rate limiting (per IP).
      - key: RATE_LIMIT_RPS
        value: "10.0"
      - key: RATE_LIMIT_BURST
        value: "20"

      # Optional Upstash Redis REST credentials (from console.upstash.com).
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: CACHE_TTL
        value: "3600"

  # ---------------------------------------------------------------------------
  # Frontend — static React + Vite build
  # ---------------------------------------------------------------------------
  - type: web
    name: microurl-frontend
    runtime: static
    buildCommand: cd frontend && npm ci --ignore-scripts && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    buildFilter:
      paths:
        - frontend/**
    envVars:
      # Public backend API URL, e.g. https://microurl-backend.onrender.com
      - key: VITE_API_BASE_URL
        sync: false
      # Cloudflare Turnstile public site key (optional; enables CAPTCHA widget).
      - key: VITE_TURNSTILE_SITE_KEY
        sync: false
